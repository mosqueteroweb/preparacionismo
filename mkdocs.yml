site_name: Wiki Preparacionismo
site_description: Recursos, técnicas y materiales para la preparación ante inundaciones, incendios, nevadas, confinamientos y apagones
site_url: https://mosqueteroweb.github.io/preparacionismo/
site_dir: _site
theme:
  name: material
  custom_dir: overrides
  language: es
  palette:
    - scheme: default
      primary: brown
      accent: orange
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: brown
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
use_directory_urls: false
extra_css:
  - stylesheets/extra-v2.css
plugins:
  - search:
      lang: es
  - awesome-pages
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - markdown.extensions.md_in_html
